name: Autonomous C++20 tests
on: [push, pull_request, workflow_dispatch]
jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, address, undefined, thread]
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 cmake python3-venv
          python3 -m venv /tmp/coverage-tools
          /tmp/coverage-tools/bin/pip install gcovr==8.8
          echo /tmp/coverage-tools/bin >> "$GITHUB_PATH"
      - name: Run offline tests (existing defects remain failures)
        env:
          CXX: g++-14
        run: python3 tests/run.py --mode ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.mode }}
          path: |
            build/tests-${{ matrix.mode }}/**/*.log
            build/tests-${{ matrix.mode }}/diagnostics.md
            build/tests-${{ matrix.mode }}/results.xml
            build/tests-${{ matrix.mode }}/coverage*
            build/summary-*.json
